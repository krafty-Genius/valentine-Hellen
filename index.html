<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Valentine 💘</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        h1 {
            font-size: 32px;
            color: #fff;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #fff;
            margin-bottom: 30px;
            font-style: italic;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 35px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .yes {
            background: #ff4d6d;
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
        }

        .yes:hover {
            transform: scale(1.1);
            background: #ff1f4b;
        }

        .no {
            background: #fff;
            color: #ff4d6d;
        }

        .no:hover {
            transform: scale(0.9);
            opacity: 0.7;
        }

        /* Celebration Message */
        .celebration {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .celebration-box {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            color: white;
            animation: pop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .celebration-box h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .celebration-box p {
            font-size: 20px;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            bottom: -50px;
            width: 20px;
            height: 20px;
            background: red;
            transform: rotate(45deg);
            animation: float 6s infinite;
            opacity: 0.7;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
        }

        .heart::before {
            top: -10px;
            left: 0;
        }

        .heart::after {
            left: -10px;
            top: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(45deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-900px) rotate(45deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Hearts -->
    <div class="heart" style="left: 10%; animation-delay: 0s;"></div>
    <div class="heart" style="left: 25%; animation-delay: 2s;"></div>
    <div class="heart" style="left: 45%; animation-delay: 4s;"></div>
    <div class="heart" style="left: 65%; animation-delay: 1s;"></div>
    <div class="heart" style="left: 85%; animation-delay: 3s;"></div>

    <div class="container">
        <h1>Will you be my Valentine? 💘</h1>
        <p>Amoke mi owon 💞</p>

        <div class="buttons">
            <button class="yes" onclick="sayYes()">Yes 💖</button>
            <button class="no">No 🙈</button>
        </div>
    </div>

    <!-- Celebration Overlay -->
    <div class="celebration" id="celebration">
        <div class="celebration-box">
            <h2>Yaaaay!!! 🎉💖</h2>
            <p>You just made me the happiest person alive 🥹<br>
               I love you, my Valentine 💘</p>
        </div>
    </div>

    <script>
        function sayYes() {
            document.getElementById("celebration").style.display = "flex";
        }
    </script>

</body>
</html>
